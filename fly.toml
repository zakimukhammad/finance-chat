app = "financebot"
primary_region = "sin"     # Singapore — closest to Indonesia

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https   = true
  auto_stop_machines  = false   # must stay on for cron jobs
  auto_start_machines = true
  min_machines_running = 1

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory_mb = 256
